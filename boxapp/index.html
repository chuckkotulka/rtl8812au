<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Scan the QR code on a box, say where it is, and find anything you packed.">
<title>Boxly — QR box inventory</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <a class="brand" href="#/boxes">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.2 12 3l9 4.2v9.6L12 21l-9-4.2V7.2Z"/><path d="M3 7.2 12 11.4l9-4.2M12 11.4V21"/></svg>
      <span>Boxly</span>
    </a>

    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="global-search" type="search" placeholder="Search boxes, items, locations…" autocomplete="off" spellcheck="false" aria-label="Search">
      <kbd class="search-kbd">/</kbd>
    </div>

    <nav class="tabs" aria-label="Sections">
      <a href="#/scan" data-tab="scan">Scan</a>
      <a href="#/boxes" data-tab="boxes">Boxes</a>
      <a href="#/locations" data-tab="locations">Locations</a>
      <a href="#/labels" data-tab="labels">Labels</a>
      <a href="#/data" data-tab="data">Data</a>
    </nav>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="bottombar" aria-label="Sections">
    <a href="#/scan" data-tab="scan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/><path d="M7.5 12h9"/></svg>
      <span>Scan</span>
    </a>
    <a href="#/boxes" data-tab="boxes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.2 12 3l9 4.2v9.6L12 21l-9-4.2V7.2Z"/><path d="M3 7.2 12 11.4l9-4.2M12 11.4V21"/></svg>
      <span>Boxes</span>
    </a>
    <a href="#/locations" data-tab="locations">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11Z"/><circle cx="12" cy="10" r="2.6"/></svg>
      <span>Places</span>
    </a>
    <a href="#/labels" data-tab="labels">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M7 9h4v4H7zM14 9.5h3.5M14 13h3.5"/></svg>
      <span>Labels</span>
    </a>
    <a href="#/data" data-tab="data">
      <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6.5" rx="7" ry="3"/><path d="M5 6.5v11c0 1.7 3.1 3 7 3s7-1.3 7-3v-11"/><path d="M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></svg>
      <span>Data</span>
    </a>
  </nav>

</div>

<div id="toasts" class="toasts" role="status" aria-live="polite"></div>

<div id="print-area" class="print-area" aria-hidden="true"></div>

<script src="vendor/jsqr.min.js"></script>
<script src="vendor/qrcode-generator.min.js"></script>
<script src="app.js"></script>
</body>
</html>
